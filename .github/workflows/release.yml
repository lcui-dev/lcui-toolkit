name: Release

on:
  push:
    branches:
      - develop

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Remove legacy npm auth setting
        run: sed -i '/^always-auth=/d' "${NPM_CONFIG_USERCONFIG}"

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Cache Fluent icon fonts
        uses: actions/cache@v4
        with:
          path: packages/fluent-icons/fonts
          key: fluent-fonts-${{ hashFiles('packages/fluent-icons/fonts-version.json') }}

      - run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          create-github-releases: true
          push-git-tags: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
